/**:
  ros__parameters:

    # The Hugging Face repo id to use
    # OpenMOSS-Team/MOSS-Image-SFT   (supervised fine-tuned, Apache 2.0)
    # OpenMOSS-Team/MOSS-Image-Base  (base model, Apache 2.0)
    repo_id: "OpenMOSS-Team/MOSS-Image-SFT"

    # Directory to cache Hugging Face models (~27 GB download)
    model_dir: "./models"

    # The torch device to use (e.g., "cuda:0" or "cpu")
    device: "cuda:0"

    # --- Initial Prompt ---

    # An initial prompt to generate an image at startup.
    # Supports plain text OR JSON: {"content": "..."}
    # Plain prompts, tag sequences and JSON layout prompts (rendered text,
    # object placement) are supported by the model.
    prompt: "A wide view of a refrigerator beside a kitchen counter with a fruit bowl, cinematic lighting, 8k resolution"

    # --- Dynamic Parameters (Adjustable via RQT) ---

    # If true, keeps the model in memory between prompts (faster)
    keep_loaded: false

    # If true, uses model CPU offloading to save VRAM
    cpu_offload: true

    # More aggressive offloading (slower) for very tight VRAM
    sequential_offload: false

    # Number of denoising steps (flow-matching Euler, default 50)
    num_inference_steps: 50

    # Classifier-free guidance strength (default 3.0)
    guidance_scale: 3.0

    # Number of images to generate per prompt request
    num_images_per_prompt: 1

    # Max prompt sequence length (default 4096)
    max_sequence_length: 4096

    # Negative-branch layer indices replaced by skipped-block prediction
    # (documented default [22]; empty list to disable)
    uncond_skip_layers: [22]

    # The frame_id for the generated image messages
    frame_id: "mossimg"

    # --- Output & Control ---

    # If true, the node will exit after generating the first image
    once: false

    # Path for saving output images. Use a path ending in "auto" for unique filenames
    image_path: "generated_images/auto"

    # Seed for the random number generator. Use -1 for a random seed on each run
    seed: -1

    # Starting value for the autogenerated image filename counter
    image_counter_start: 1

    # Dimensions of the generated image (positive multiples of 16)
    height: 1024
    width: 1024
